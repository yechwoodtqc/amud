name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - compat/android6-dpad

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --flavor github --target-platform android-arm,android-arm64

      - name: Name APK
        run: cp build/app/outputs/flutter-apk/app-github-release.apk amud-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amud-android-apk
          path: amud-android.apk
          if-no-files-found: error
          retention-days: 14
