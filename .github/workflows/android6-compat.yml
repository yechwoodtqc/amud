name: Android 6 API 23 compatibility build

on:
  workflow_dispatch:
  push:
    branches:
      - compat/android6-api23

permissions:
  contents: read

jobs:
  android6-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.8
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build API 23 APK
        run: flutter build apk --release --flavor github --target-platform android-arm,android-arm64
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amud-android6-api23
          path: build/app/outputs/flutter-apk/app-github-release.apk
          if-no-files-found: error
          retention-days: 14
